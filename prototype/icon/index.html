<!DOCTYPE html>
<!--
  PROTOTYPE — throw this away after you pick an icon.
  Question: which menu-bar icon still means Nightshift at 16pt, in one color?
  Three variants, switchable via ?variant= (A pictogram, B meter, C mark).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightshift icon lab</title>
<style>
  :root {
    color-scheme: light;
    --paper: #e7e2d8;
    --ink: #1c1915;
    --muted: #6e675f;
    --line: #d3cdc2;
    --card: #f7f4ee;
    --amber: #e09a22;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    padding: 28px 20px 96px;
  }
  main { max-width: 920px; margin: 0 auto; }
  h1 { font-size: 15px; font-weight: 650; margin: 0 0 4px; letter-spacing: -0.01em; }
  .question { margin: 0 0 18px; color: var(--muted); max-width: 62ch; }
  .stage { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 18px; }
  @media (max-width: 760px) { .stage { grid-template-columns: 1fr; } }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 16px;
  }
  .bars { display: grid; gap: 10px; }
  .bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .bar {
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    padding: 0 12px 0 14px;
  }
  .bar.light { background: #f4f4f5; color: #1d1d1f; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
  .bar.dark { background: #2b2b2d; color: #f5f5f7; }
  .bar.open { background: #f4f4f5; color: #1d1d1f; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
  .slot {
    width: 28px;
    height: 24px;
    display: grid;
    place-items: center;
    border-radius: 5px;
  }
  .slot.on { background: #0a84ff; color: white; }
  .slot svg, .zoom svg { display: block; overflow: visible; }
  .clock { font-variant-numeric: tabular-nums; font-weight: 560; font-size: 13px; letter-spacing: -0.02em; }
  .zoom-wrap { margin-top: 16px; display: flex; gap: 16px; align-items: center; }
  .zoom {
    width: 180px;
    height: 180px;
    background:
      linear-gradient(to right, rgba(0,0,0,.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0,0,0,.06) 1px, transparent 1px),
      #fff;
    background-size: 10px 10px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    color: var(--ink);
  }
  .zoom.amber { color: var(--amber); }
  .read {
    font-size: 13px;
    color: var(--muted);
    margin: 0;
    max-width: 28ch;
  }
  .read strong { color: var(--ink); font-weight: 620; }
  .controls h2 { font-size: 13px; margin: 0 0 4px; }
  .idea { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  fieldset {
    border: 0;
    margin: 0 0 12px;
    padding: 0;
  }
  legend { font-size: 12px; color: var(--muted); margin-bottom: 6px; padding: 0; }
  .seg { display: flex; gap: 4px; flex-wrap: wrap; }
  .seg button, .text-btn {
    border: 0;
    background: #ece7df;
    color: var(--ink);
    border-radius: 8px;
    padding: 6px 10px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #f7f4ee; }
  label.slider {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 2px 8px;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 12px;
  }
  label.slider input { grid-column: 1 / -1; width: 100%; }
  .lesson {
    background: #fff6e4;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    margin: 4px 0 12px;
  }
  dl { margin: 0; display: grid; grid-template-columns: 88px 1fr; gap: 3px 8px; font-size: 12px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-variant-numeric: tabular-nums; }
  .switcher {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 6px;
    background: #141311;
    color: #f6f3ee;
    border-radius: 999px;
    padding: 6px;
    box-shadow: 0 10px 28px rgba(28, 25, 21, .28);
    z-index: 5;
  }
  .switcher button {
    width: 32px;
    height: 32px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: 16px;
    cursor: pointer;
  }
  .switcher button:hover { background: rgba(255,255,255,.08); }
  .switcher .name { min-width: 148px; text-align: center; font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Menu-bar icon lab</h1>
  <p class="question">Nightshift draws a 16pt template image in the menu bar (Apple’s <code>sun.horizon</code> today). Template means one color: black becomes the menu-bar label, and flips when the bar does. Judge the real-size bars. The grid is 10×, one cell per point.</p>
  <div class="stage">
    <section class="card" id="preview"></section>
    <section class="card controls" id="controls"></section>
  </div>
</main>
<div class="switcher" id="switcher">
  <button type="button" id="prev" aria-label="Previous variant">←</button>
  <div class="name" id="switcher-label"></div>
  <button type="button" id="next" aria-label="Next variant">→</button>
</div>
<script>
const VARIANTS = [
  { id: "A", name: "Pictogram", idea: "A picture of sunset says what the app is. It stays the same at warmth 0 and warmth 100." },
  { id: "B", name: "Meter", idea: "The icon is the warmth. Drag the slider and watch the real-size bar, not the zoom." },
  { id: "C", name: "Mark", idea: "A mark names the app. It does not have to be a sun. Letters collapse at this size." },
];

const knobs = {
  A: { sun: "sink", horizon: "gaps", rays: "0", weight: 1.5 },
  B: { shape: "arc", warmth: 40, weight: 1.75 },
  C: { mark: "moon", weight: 1.75, tile: "off" },
};
let ink = "template";

function variantId() {
  const v = new URLSearchParams(location.search).get("variant");
  return VARIANTS.some((item) => item.id === v) ? v : "A";
}

function setVariant(id) {
  const url = new URL(location.href);
  url.searchParams.set("variant", id);
  history.replaceState(null, "", url);
  render();
}

function cycle(step) {
  const ids = VARIANTS.map((item) => item.id);
  const i = ids.indexOf(variantId());
  setVariant(ids[(i + step + ids.length) % ids.length]);
}

function svg(uid, body, size) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 18 18" aria-hidden="true">${body(uid)}</svg>`;
}

function line(x1, y1, x2, y2, sw) {
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round"/>`;
}

function rays(cx, cy, inner, outer, count, sw) {
  const angles = count === 3 ? [-120, -90, -60] : [0, 45, 90, 135, 180, 225, 270, 315];
  return angles.map((deg) => {
    const a = (deg * Math.PI) / 180;
    return line(
      cx + inner * Math.cos(a),
      cy + inner * Math.sin(a),
      cx + outer * Math.cos(a),
      cy + outer * Math.sin(a),
      sw
    );
  }).join("");
}

function arcPath(cx, cy, r, start, sweep) {
  const p = (deg) => {
    const a = ((deg - 90) * Math.PI) / 180;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  };
  const [x1, y1] = p(start);
  const [x2, y2] = p(start + sweep);
  const large = sweep > 180 ? 1 : 0;
  return `M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
}

function pictogram(k, uid) {
  const sw = k.weight;
  let body = "";
  if (k.sun === "ring") {
    body += `<circle cx="9" cy="6.6" r="2.7" fill="none" stroke="currentColor" stroke-width="${sw}"/>`;
    if (k.rays !== "0") body += rays(9, 6.6, 4.1, k.rays === "3" ? 6.2 : 7.1, Number(k.rays), sw);
  } else if (k.sun === "fill") {
    body += `<circle cx="9" cy="6.6" r="3" fill="currentColor"/>`;
    if (k.rays !== "0") body += rays(9, 6.6, 4.3, k.rays === "3" ? 6.3 : 7.2, Number(k.rays), sw);
  } else {
    body += `<clipPath id="${uid}-rise"><rect x="0" y="0" width="18" height="11"/></clipPath>`;
    body += `<circle cx="9" cy="11" r="4.4" fill="currentColor" clip-path="url(#${uid}-rise)"/>`;
    if (k.rays !== "0") body += rays(9, 8.2, 5.2, k.rays === "3" ? 7 : 8, Number(k.rays), sw);
  }
  if (k.horizon === "line") body += line(2.2, 11.6, 15.8, 11.6, sw);
  if (k.horizon === "gaps") {
    body += line(2, 11.6, 5.4, 11.6, sw);
    body += line(12.6, 11.6, 16, 11.6, sw);
  }
  return body;
}

function thermoShell(half, top, by, br) {
  const left = 9 - half;
  const right = 9 + half;
  const join = by - Math.sqrt(Math.max(br * br - half * half, 0));
  const n = (v) => v.toFixed(2);
  return `M ${n(left)} ${n(join)} L ${n(left)} ${n(top)} A ${half} ${half} 0 0 1 ${n(right)} ${n(top)} L ${n(right)} ${n(join)} A ${br} ${br} 0 1 1 ${n(left)} ${n(join)} Z`;
}

function thermometer(k, uid) {
  const warmth = Number(k.warmth) / 100;
  const sw = Number(k.weight);
  const inset = sw * 0.46;
  const top = 2.7;
  const half = 2.05;
  const by = 13.35;
  const br = 3.55;
  const shell = thermoShell(half, top, by, br);
  const ih = Math.max(half - inset, 0.5);
  const ibr = Math.max(br - inset, 0.7);
  const itop = top;
  const ijoin = by - Math.sqrt(Math.max(ibr * ibr - ih * ih, 0));
  const capTop = itop - ih;
  const fillTop = capTop + (ijoin - capTop) * (1 - warmth);
  const inner = thermoShell(ih, itop, by, ibr);
  return `<mask id="${uid}-glass"><rect width="18" height="18" fill="white"/><path d="${inner}" fill="black"/></mask>` +
    `<path d="${shell}" fill="currentColor" stroke="currentColor" stroke-width="${sw}" stroke-linejoin="round" mask="url(#${uid}-glass)"/>` +
    `<clipPath id="${uid}-th"><path d="${inner}"/></clipPath>` +
    `<rect x="0" y="${fillTop.toFixed(2)}" width="18" height="18" fill="currentColor" clip-path="url(#${uid}-th)"/>`;
}

function meter(k, uid) {
  const sw = k.weight;
  const warmth = Number(k.warmth);
  if (k.shape === "arc") {
    const track = arcPath(9, 9.4, 5.4, 135, 270);
    const sweep = 270 * (warmth / 100);
    const value = sweep > 0.5 ? arcPath(9, 9.4, 5.4, 135, sweep) : "";
    return `<path d="${track}" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="${sw}" stroke-linecap="round"/>` +
      (value ? `<path d="${value}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round"/>` : "");
  }
  if (k.shape === "column") {
    const innerH = 12.5 * (warmth / 100);
    const y = 2.6 + (12.5 - innerH);
    return `<rect x="5.6" y="1.8" width="6.8" height="14.4" rx="2.2" fill="none" stroke="currentColor" stroke-width="${Math.min(sw, 1.75)}"/>` +
      (innerH > 0.4 ? `<rect x="7" y="${y.toFixed(2)}" width="4" height="${innerH.toFixed(2)}" rx="1" fill="currentColor"/>` : "");
  }
  if (k.shape === "thermo") return thermometer(k, uid);
  const lit = warmth === 0 ? 0 : warmth < 34 ? 1 : warmth < 67 ? 2 : 3;
  return [12.6, 9, 5.4].map((cy, i) => {
    const on = i < lit;
    return `<circle cx="9" cy="${cy}" r="1.7" fill="${on ? "currentColor" : "none"}" stroke="currentColor" stroke-width="${on ? 0 : sw}"/>`;
  }).join("");
}

function crescent(cx, cy, r, ox, oy, br) {
  const dx = ox - cx;
  const dy = oy - cy;
  const d = Math.hypot(dx, dy);
  const a = (r * r - br * br + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, r * r - a * a));
  const xm = cx + (a * dx) / d;
  const ym = cy + (a * dy) / d;
  const p1x = xm + (-dy * h) / d;
  const p1y = ym + (dx * h) / d;
  const p2x = xm - (-dy * h) / d;
  const p2y = ym - (dx * h) / d;
  const n = (v) => v.toFixed(2);
  return `M ${n(p1x)} ${n(p1y)} A ${r} ${r} 0 1 1 ${n(p2x)} ${n(p2y)} A ${br} ${br} 0 0 0 ${n(p1x)} ${n(p1y)} Z`;
}

function markGlyph(k, sw) {
  if (k.mark === "moon") {
    const bite = 5.15 - (sw - 1) * 0.7;
    const shift = 2.6 + (2.5 - sw) * 0.55;
    return `<path fill="currentColor" d="${crescent(7.6, 9.2, 5.3, 7.6 + shift, 7.3, bite)}"/>`;
  }
  if (k.mark === "sun") {
    return `<circle cx="9" cy="9" r="2.5" fill="currentColor"/>` + rays(9, 9, 4, 6.6, 8, sw);
  }
  const bulge = (sw - 1) * 0.45;
  return `<path fill="currentColor" d="M4.2 14.2 V3.8 H${(6.4 + bulge).toFixed(2)} L${(11.2 - bulge).toFixed(2)} 11.2 V3.8 H13.8 V14.2 H${(11.6 - bulge).toFixed(2)} L${(6.8 + bulge).toFixed(2)} 6.8 V14.2 Z"/>`;
}

function mark(k, uid) {
  const glyph = markGlyph(k, k.weight);
  if (k.tile !== "on") return glyph;
  const punched = glyph
    .replaceAll('fill="currentColor"', 'fill="black"')
    .replaceAll('stroke="currentColor"', 'stroke="black"');
  return `<mask id="${uid}-tile"><rect x="1.2" y="1.2" width="15.6" height="15.6" rx="3.6" fill="white"/>${punched}</mask>` +
    `<rect x="1.2" y="1.2" width="15.6" height="15.6" rx="3.6" fill="currentColor" mask="url(#${uid}-tile)"/>`;
}

function draw(id, uid) {
  if (id === "A") return (u) => pictogram(knobs.A, u);
  if (id === "B") return (u) => meter(knobs.B, u);
  return (u) => mark(knobs.C, u);
}

function wifi() {
  return `<svg width="15" height="15" viewBox="0 0 15 15" aria-hidden="true">
    <path d="M2 6.2 C4.2 4 10.8 4 13 6.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M4.2 8.5 C5.8 7 9.2 7 10.8 8.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="7.5" cy="11" r="1" fill="currentColor"/>
  </svg>`;
}

function battery() {
  return `<svg width="22" height="12" viewBox="0 0 22 12" aria-hidden="true">
    <rect x="0.7" y="0.7" width="18" height="10.6" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <rect x="2.2" y="2.2" width="12" height="7.6" rx="1" fill="currentColor"/>
    <rect x="19.4" y="3.6" width="1.6" height="4.8" rx="0.6" fill="currentColor"/>
  </svg>`;
}

function iconColor(selected) {
  if (ink === "amber") return "var(--amber)";
  if (selected) return "white";
  return "currentColor";
}

function slot(selected, uid) {
  const id = variantId();
  const body = draw(id);
  return `<div class="slot${selected ? " on" : ""}" style="color:${iconColor(selected)}">${svg(uid, body, 18)}</div>`;
}

function bar(kind, label, selected) {
  return `<div>
    <div class="bar-label"><span>${label}</span></div>
    <div class="bar ${kind}">
      ${slot(selected, kind)}
      ${wifi()}
      ${battery()}
      <span class="clock">9:41</span>
    </div>
  </div>`;
}

function lesson(id) {
  const k = knobs[id];
  if (ink === "amber") return "Amber stays amber. On the light bar it sinks into the background. On the open menu it no longer turns white.";
  if (id === "A" && k.sun === "sink" && k.horizon === "line") return "The horizon cuts through the disc. Gaps put the line behind the sun.";
  if (id === "A" && k.rays === "8") return "Eight rays at 16pt clump. Three, or none, still reads as a sun.";
  if (id === "A" && k.weight < 1.25 && k.sun === "ring") return "Under 1.25pt the ring drops out. Look at the light bar, then the zoom.";
  if (id === "B" && k.shape === "thermo" && Number(k.weight) >= 2.25) return "This stroke closes the stem. The fill has nowhere to go.";
  if (id === "B" && k.shape === "thermo" && Number(k.warmth) >= 90) return "A full stem joins the bulb and becomes one blob. Compare it with the battery.";
  if (id === "B" && k.shape === "thermo") return "The bulb is what you recognize. The stem is only a few pixels, so 40 and 70 look almost the same in the bar.";
  if (id === "B" && Number(k.warmth) === 0) return "Warmth 0 still needs a shape, or the menu bar looks empty and broken.";
  if (id === "B" && k.shape === "dots" && Number(k.warmth) === 100) return "Three dots max out early. 70 and 100 look the same.";
  if (id === "C" && k.mark === "n" && k.weight >= 2.2) return "A heavier N fills in. The counter (the hole) is what makes the letter.";
  if (id === "C" && k.tile === "on") return "A filled tile becomes a blob beside Wi‑Fi. Menu-bar icons stay transparent around the mark.";
  if (id === "C" && k.mark === "sun") return "This sun has no horizon, so it fights less with the clock. It also means “day,” which is the opposite of the ramp.";
  if (id !== "B") return "This drawing ignores warmth. Set it once; it will not move at sunset.";
  return "Squint at the 16pt bar. If you need the zoom to tell what changed, the menu bar will not show it.";
}

function stateRows(id) {
  const k = knobs[id];
  const rows = [["Ink", ink === "template" ? "template, one color" : "fixed amber"]];
  if (id === "A") {
    rows.push(["Sun", k.sun], ["Horizon", k.horizon], ["Rays", k.rays], ["Stroke", k.weight.toFixed(2) + " pt"]);
  } else if (id === "B") {
    rows.push(["Shape", k.shape], ["Warmth", k.warmth + "%"], ["Stroke", k.weight.toFixed(2) + " pt"]);
  } else {
    rows.push(["Mark", k.mark], ["Weight", k.weight.toFixed(2)], ["Tile", k.tile]);
  }
  return rows.map(([name, value]) => `<dt>${name}</dt><dd>${value}</dd>`).join("");
}

function seg(key, label, value, options) {
  return `<fieldset><legend>${label}</legend><div class="seg">${options.map(([id, text]) =>
    `<button type="button" data-key="${key}" data-value="${id}" aria-pressed="${value === id}">${text}</button>`
  ).join("")}</div></fieldset>`;
}

function slider(key, label, value, min, max, step) {
  return `<label class="slider"><span>${label}</span><span class="val">${value}</span>
    <input type="range" data-key="${key}" min="${min}" max="${max}" step="${step}" value="${value}">
  </label>`;
}

function controlsFor(id) {
  const k = knobs[id];
  let fields = "";
  if (id === "A") {
    fields += seg("sun", "Sun", k.sun, [["ring", "Ring"], ["fill", "Solid"], ["sink", "Sinking"]]);
    fields += seg("horizon", "Horizon", k.horizon, [["none", "None"], ["gaps", "Gaps"], ["line", "Full line"]]);
    fields += seg("rays", "Rays", k.rays, [["0", "No rays"], ["3", "3 rays"], ["8", "8 rays"]]);
    fields += slider("weight", "Stroke", k.weight, 1, 2.5, 0.25);
  } else if (id === "B") {
    fields += seg("shape", "Shape", k.shape, [["arc", "Arc"], ["column", "Column"], ["thermo", "Thermometer"], ["dots", "Dots"]]);
    fields += slider("warmth", "Warmth", k.warmth, 0, 100, 1);
    fields += slider("weight", "Stroke", k.weight, 1.25, 2.5, 0.25);
  } else {
    fields += seg("mark", "Mark", k.mark, [["moon", "Moon"], ["n", "N"], ["sun", "Sun"]]);
    fields += seg("tile", "Tile", k.tile, [["off", "No tile"], ["on", "Filled tile"]]);
    fields += slider("weight", "Weight", k.weight, 1, 2.5, 0.25);
  }
  fields += seg("ink", "Ink", ink, [["template", "Template"], ["amber", "Amber"]]);
  return fields;
}

function paint() {
  const id = variantId();
  const meta = VARIANTS.find((item) => item.id === id);
  document.getElementById("switcher-label").textContent = `${id} — ${meta.name}`;
  const zoomColor = ink === "amber" ? " amber" : "";
  document.getElementById("preview").innerHTML = `
    <div class="bars">
      ${bar("light", "Light menu bar", false)}
      ${bar("dark", "Dark menu bar", false)}
      ${bar("open", "Menu open", true)}
    </div>
    <div class="zoom-wrap">
      <div class="zoom${zoomColor}">${svg("zoom", draw(id), 160)}</div>
      <p class="read"><strong>Look at the bars.</strong> ${lesson(id)}</p>
    </div>`;
  const state = document.getElementById("state");
  if (state) state.innerHTML = stateRows(id);
}

function render() {
  const id = variantId();
  const meta = VARIANTS.find((item) => item.id === id);
  document.getElementById("controls").innerHTML = `
    <h2>${id} — ${meta.name}</h2>
    <p class="idea">${meta.idea}</p>
    <div id="fields">${controlsFor(id)}</div>
    <dl id="state"></dl>`;
  paint();
}

document.getElementById("controls").addEventListener("click", (event) => {
  const button = event.target.closest("button[data-value]");
  if (!button) return;
  const key = button.dataset.key;
  if (key === "ink") ink = button.dataset.value;
  else knobs[variantId()][key] = button.dataset.value;
  render();
});

document.getElementById("controls").addEventListener("input", (event) => {
  const input = event.target;
  if (input.type !== "range") return;
  const key = input.dataset.key;
  const value = Number(input.value);
  knobs[variantId()][key] = value;
  input.parentElement.querySelector(".val").textContent = value;
  paint();
});

document.getElementById("prev").addEventListener("click", () => cycle(-1));
document.getElementById("next").addEventListener("click", () => cycle(1));

document.addEventListener("keydown", (event) => {
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || (document.activeElement && document.activeElement.isContentEditable)) return;
  if (event.key === "ArrowLeft") { cycle(-1); event.preventDefault(); }
  if (event.key === "ArrowRight") { cycle(1); event.preventDefault(); }
});

render();
</script>
</body>
</html>
